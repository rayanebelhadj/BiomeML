shuffle_labels_ibd:
  name: shuffle_labels_ibd
  dataset: agp
  disease: ibd
  description: Shuffled labels control for IBD
  data_extraction:
    shuffle_labels: true
  model_training:
    architecture:
      model_type: GINEConv
shuffle_labels_t2d:
  name: shuffle_labels_t2d
  dataset: agp
  disease: Diabetes
  description: Shuffled labels control for AGP Diabetes
  data_extraction:
    shuffle_labels: true
  model_training:
    architecture:
      model_type: GINEConv

# gnn_meta_ibd (GNN + clinical-metadata late fusion) is DEFERRED: the clinical-feature
# pipeline is not wired end-to-end yet (NB01 does not emit clinical columns and
# feature_loader points at a file nobody writes). Re-enable once that is implemented;
# until then it would silently train a plain GINEConv. See ONBOARDING / fix branch notes.

no_graph_mlp:
  name: no_graph_mlp
  dataset: agp
  disease: ibd
  description: MLP baseline - no graph structure
  model_training:
    architecture:
      model_type: MLP

# baseline_ages removed: AGP has no 'ages' disease column and there is no defined
# binary age-prediction target. Re-add with a real condition if needed.

