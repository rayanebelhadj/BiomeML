  dataset: agp
  disease: Diabetes
  description: 1D CNN baseline for Diabetes
  model_training:
    architecture:
      model_type: CNN

# Multi-class age experiments (Q3 sub-question: is binary classification the
# 'same' as multi-class?). 6 decade bins from age_cat (20s..70+). num_classes=6
# triggers NB03's CrossEntropyLoss + argmax path; matching is skipped in NB01.
baseline_age:
  name: baseline_age
  dataset: agp
  disease: AGE_CATEGORY
  description: GINEConv on multi-class age (Q3 - binary vs multi-class)
  model_training:
    architecture:
      model_type: GINEConv
      num_classes: 6
no_graph_age:
  name: no_graph_age
  dataset: agp
  disease: AGE_CATEGORY
  description: MLP baseline on multi-class age (Q3 control)
  model_training:
    architecture:
      model_type: MLP
      num_classes: 6
cnn_age:
  name: cnn_age
  dataset: agp
  disease: AGE_CATEGORY
  description: CNN baseline on multi-class age (Q3)
  model_training:
    architecture:
      model_type: CNN
      num_classes: 6

# baseline_ages removed: AGP has no 'ages' disease column and there is no defined
# binary age-prediction target. Re-add with a real condition if needed.

