# Main-question comparison: phylogenetic tree distance vs sequence distance.
# NB01 now also computes SeqDistMatrix (Jukes-Cantor on the 150 bp ASV nucleotide
# sequences, which AGP feature IDs already are -- co-aligned by 16S region).
# `baseline` is the tree-distance reference (primary_matrix=TreeDistMatrix from
# config.yaml). `distance_sequence` flips the primary to SeqDistMatrix on the
# same extraction. (distance_graph remains unimplemented -- no GraphDistMatrix.)
distance_sequence:
  name: distance_sequence
  dataset: agp
  disease: ibd
  description: Sequence-based (Jukes-Cantor) distance graphs vs baseline tree-distance
  data_extraction:
    distance_matrices:
      primary_matrix: "SeqDistMatrix"
edge_identity:
  name: edge_identity
  dataset: agp
  disease: ibd
  description: Edge weight strategy identity
  graph_construction:
    weights:
      weight_transform: identity
