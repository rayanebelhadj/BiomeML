# --- Graph-topology controls (Cursor plan): random_edges keeps the GNN's
# edge budget but randomizes which pairs connect (tests whether phylogenetic
# neighborhoods matter vs any graph); complete_graph fully connects features
# (tests whether sparsity matters). Same controls across the 4 working diseases.
# NOTE: complete_graph on ~1975 features is ~2M edges/sample; tractable on A100
# but slow -- consider reducing feature_filtering.max_features if needed.
random_edges_ibd:
  {name: random_edges_ibd, dataset: agp, disease: ibd, description: Random-topology control on IBD (same edge budget as k-NN), graph_construction: {graph_type: random_edges, knn: {k: 10}}}
complete_graph_ibd:
  {name: complete_graph_ibd, dataset: agp, disease: ibd, description: Fully-connected control on IBD, graph_construction: {graph_type: complete}}
random_edges_t2d:
  {name: random_edges_t2d, dataset: agp, disease: Diabetes, description: Random-topology control on Diabetes, graph_construction: {graph_type: random_edges, knn: {k: 10}}}
complete_graph_t2d:
  {name: complete_graph_t2d, dataset: agp, disease: Diabetes, description: Fully-connected control on Diabetes, graph_construction: {graph_type: complete}}
random_edges_cancer:
  {name: random_edges_cancer, dataset: agp, disease: Cancer, description: Random-topology control on Cancer, graph_construction: {graph_type: random_edges, knn: {k: 10}}}
complete_graph_cancer:
  {name: complete_graph_cancer, dataset: agp, disease: Cancer, description: Fully-connected control on Cancer, graph_construction: {graph_type: complete}}
random_edges_autoimmune:
  {name: random_edges_autoimmune, dataset: agp, disease: Autoimmune, description: Random-topology control on Autoimmune, graph_construction: {graph_type: random_edges, knn: {k: 10}}}
complete_graph_autoimmune:
  {name: complete_graph_autoimmune, dataset: agp, disease: Autoimmune, description: Fully-connected control on Autoimmune, graph_construction: {graph_type: complete}}

