# CNN baselines (Q2: graphs vs CNN fixed neighborhoods, the main-question argument
# that graphs allow more flexible representations than CNNs).
cnn_ibd:
  name: cnn_ibd
  dataset: agp
  disease: ibd
  description: 1D CNN baseline (Q2 - tests if graphs beat fixed CNN neighborhoods)
  model_training:
    architecture:
      model_type: CNN
