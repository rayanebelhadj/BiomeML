# AGP - T2D experiments
baseline_t2d:
  name: baseline_t2d
  dataset: agp
  disease: Diabetes
  description: GINEConv baseline for AGP Diabetes
  model_training:
    architecture:
      model_type: GINEConv
gcn_t2d:
  name: gcn_t2d
  dataset: agp
  disease: Diabetes
  description: GCN for AGP Diabetes
  model_training:
    architecture:
      model_type: GCN
gat_t2d:
  name: gat_t2d
  dataset: agp
  disease: Diabetes
  description: GAT for AGP Diabetes
  model_training:
    architecture:
      model_type: GAT

edge_abundance_product:
  name: edge_abundance_product
  dataset: agp
  disease: ibd
  description: Edge weight strategy abundance_product
  graph_construction:
    weights:
      weight_transform: abundance_product
edge_abundance_geometric:
  name: edge_abundance_geometric
  dataset: agp
  disease: ibd
  description: Edge weight strategy abundance_geometric
  graph_construction:
    weights:
      weight_transform: abundance_geometric
edge_abundance_log:
  name: edge_abundance_log
  dataset: agp
