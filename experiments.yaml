layers_3:
  name: layers_3
  dataset: agp
  disease: ibd
  description: Three layers
  model_training:
    architecture:
      num_layers: 3
dropout_01:
  name: dropout_01
  dataset: agp
  disease: ibd
  description: Low dropout 0.1
  model_training:
    architecture:
      dropout: 0.1
dropout_05:
  name: dropout_05
  dataset: agp
  disease: ibd
  description: High dropout 0.5
  model_training:
    architecture:
      dropout: 0.5
lr_001:
  name: lr_001
  dataset: agp
  disease: ibd
  description: Learning rate 0.001
  model_training:
    training:
      learning_rate: 0.001
lr_00001:
  name: lr_00001
  dataset: agp
  disease: ibd
  description: Learning rate 0.00001
  model_training:
    training:
      learning_rate: 0.00001
batch_32:
  name: batch_32
  dataset: agp
  disease: ibd
  description: Batch size 32
  model_training:
    training:
