# ==============================================================================
# AGP EXPERIMENTS (dataset: agp) -- same as v1
# ==============================================================================

baseline:
  name: baseline
  dataset: agp
  disease: ibd
  description: GINEConv baseline with k=10, Pearson correlation graph
  graph_construction:
    graph_type: knn
  model_training:
    architecture:
      model_type: GINEConv
k_5:
  name: k_5
  dataset: agp
  disease: ibd
  description: k-NN with k=5
  graph_construction:
    knn:
      k: 5
k_15:
  name: k_15
  dataset: agp
  disease: ibd
  description: k-NN with k=15
  graph_construction:
    knn:
      k: 15
k_20:
  name: k_20
  dataset: agp
  disease: ibd
  description: k-NN with k=20
  graph_construction:
    knn:
      k: 20
# distance_tree / distance_sequence / distance_graph REMOVED: they set no overrides,
# so they were byte-identical to `baseline` (all use TreeDistMatrix). Real
# sequence/graph-distance experiments require NB01 to compute SeqDistMatrix /
# GraphDistMatrix and the experiment to set data_extraction.distance_matrices
# accordingly; until that is implemented these were silent no-ops. distance_tree
# is just baseline. Re-add with proper overrides once the matrices are produced.
edge_identity:
  name: edge_identity
  dataset: agp
  disease: ibd
  description: Edge weight strategy identity
  graph_construction:
    weights:
      weight_transform: identity
edge_exponential:
  name: edge_exponential
  dataset: agp
  disease: ibd
  description: Edge weight strategy exponential
  graph_construction:
    weights:
      weight_transform: exponential
edge_binary:
  name: edge_binary
  dataset: agp
  disease: ibd
  description: Edge weight strategy binary
  graph_construction:
    weights:
      weight_transform: binary
gcn_arch:
